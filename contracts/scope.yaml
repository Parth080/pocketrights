# ---------------------------------------------------------------------------
# Out of scope
#
# Each of these is TRAINED and EVALUATED as a refusal. Near-miss examples are
# mandatory — they are the hard cases, adjacent to a supported vertical.
# ---------------------------------------------------------------------------
out_of_scope:

  - id: oos.criminal
    title: Criminal matters
    redirect: "A criminal matter needs a lawyer. Free legal aid is available through your District Legal Services Authority."
    near_misses:
      - "my landlord threatened and pushed me"            # tenancy-adjacent
      - "the seller took my money and vanished, can I file an FIR"  # consumer-adjacent
      - "I was arrested after a road accident"            # traffic-adjacent

  - id: oos.family
    title: Family law
    redirect: "Family law needs a qualified lawyer. Free legal aid is available through your District Legal Services Authority."
    near_misses:
      - "my husband wants a divorce, what are my rights"
      - "my brother is not giving me my share of our father's property"

  - id: oos.property_title
    title: Property title and ownership disputes
    redirect: "Property title disputes need a property lawyer."
    near_misses:
      - "my landlord is not the real owner of the flat"   # tenancy-adjacent
      - "builder has not given possession after 4 years"  # consumer-adjacent, genuinely hard

  - id: oos.immigration
    title: Immigration, visa, passport, citizenship
    redirect: "This tool does not cover immigration matters."
    near_misses:
      - "my employer is holding my passport"              # employment-adjacent

  - id: oos.litigation_strategy
    title: Litigation strategy and case outcome prediction
    redirect: "Whether to appeal and how to argue a case needs a lawyer who can see your papers."
    near_misses:
      - "will I win my consumer case"
      - "should I appeal the commission's order"
      - "draft a legal notice for me"

  - id: oos.individualised_advice
    title: Individualised legal advice or representation
    redirect: "This tool gives general legal information, not advice on your specific matter."
    near_misses:
      - "tell me exactly what to do in my case, I'll follow it"

  - id: oos.other_domains
    title: Other legal domains
    redirect: "This tool covers consumer, tenancy, traffic, salary/PF/gratuity, and insurance only."
    near_misses:
      - "bank is charging me huge penalty on my loan"
      - "hospital was negligent during my surgery"
      - "someone is using my photos on instagram"
      - "how do I file my income tax return"

# ---------------------------------------------------------------------------
# Response behaviours — the three shapes a response can take
# ---------------------------------------------------------------------------
behaviours:
  - id: answer
    description: In scope, enough information present — give the structured answer.
    target_share: 0.70
  - id: refuse
    description: Out of scope — decline and redirect.
    target_share: 0.15
  - id: clarify
    description: In scope but a required trigger is unmet — ask exactly one question.
    target_share: 0.10
  - id: multi_turn
    description: Clarification asked and answered, then answered fully.
    target_share: 0.05

# ---------------------------------------------------------------------------
# Language mix
# ---------------------------------------------------------------------------
language:
  # PocketRights is bilingual. The Gazette publishes authoritative Hindi
  # alongside English, so the corpus carries both — professionally produced,
  # legally authoritative parallel text, not machine translation.
  answer_languages: [en, hi]
  output_policy: mirror_input
  output_policy_note: >
    Answer in the language the question was asked in. Romanized Hinglish is
    answered in English unless the user writes in Devanagari.
  input_styles:
    - id: plain_english
      target_share: 0.42
    - id: colloquial_english
      target_share: 0.18
    - id: romanized_hinglish
      target_share: 0.15
    - id: devanagari_hindi
      target_share: 0.25
  register_warning: >
    Gazette Hindi is heavily Sanskritised legal register. Citizens do not speak
    it. Hindi answers must use plain spoken Hindi, not statutory Hindi — the
    corpus supplies the law, not the voice.
