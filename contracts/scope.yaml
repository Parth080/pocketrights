        critical_omissions:
          - "The free-look remedy where still available"

      - id: insurance.where_to_complain
        title: Where to escalate an insurance grievance
        example: "insurance company is not responding, what next"
        requires: [policy_type]
        escalation_route: true
        critical_omissions:
