# PocketRights — machine-readable scope definition
#
# THIS FILE IS THE SOURCE OF TRUTH for what PocketRights answers.
# docs/scope.md is the human-readable narrative; this is what code reads.
#
# Everything downstream keys off the `id` fields here: dataset labels,
# benchmark strata, verifier rules, coverage assertions. Changing an id is a
# breaking change — add a new one and deprecate the old instead.
#
# Validated by tests/test_scope.py

version: "1.0"
status: draft            # draft | frozen. Must be `frozen` before task 25.
frozen_at: null
corpus_jurisdiction: IN

# ---------------------------------------------------------------------------
# Clarification triggers
#
# Conditions under which the model MUST ask before answering, because the
# answer materially changes. Referenced by category via `requires`.
# ---------------------------------------------------------------------------
clarification_triggers:
  - id: state
    question: "Which state are you in?"
    why: "State law, notifications, or compounding amounts materially change the answer."
  - id: incident_date
    question: "Roughly when did this happen?"
    why: "Limitation periods run from the cause of action; the legal regime may also differ by date."
  - id: employment_type
    question: "Is this a private company, and roughly how many employees does it have?"
    why: "Applicability of gratuity, PF, and bonus provisions depends on establishment type and size."
  - id: policy_type
    question: "Is this a health, motor, or life policy?"
    why: "Claim timelines and grievance routes differ substantially by policy class."
  - id: claim_amount
    question: "Roughly what is the value of the goods or services involved?"
    why: "Pecuniary jurisdiction determines which consumer commission hears the matter."
  - id: vehicle_type
    question: "Was this a two-wheeler, car, or commercial vehicle?"
    why: "Penalties and document requirements differ by vehicle class."
  - id: establishment_category
    question: "Is your workplace an office or shop, or a factory?"
    why: >
      Working hours, leave and overtime come from the state Shops and
      Establishments Act for offices and shops, and from separate factory
      legislation for factories. The entitlements differ.

# ---------------------------------------------------------------------------
# Supported domains
# ---------------------------------------------------------------------------
domains:

  # =========================================================================
  - id: consumer
    title: Consumer / e-commerce
    description: >
      Everyday disputes involving goods and services bought by a consumer,
      including online marketplaces.
    primary_acts: [cpa2019, ecommerce_rules_2020, lm_pc_rules_2011]
    categories:

      - id: consumer.defective_product
        title: Defective or damaged product
        example: "flipkart sent me a cracked phone, what can I do"
        requires: []
        critical_omissions:
          - "That 'defect' has a statutory definition and the claim rests on it"
          - "The available reliefs (replacement, refund, compensation)"

      - id: consumer.refund_refused
        title: Refund or replacement refused
        example: "seller is refusing to refund even though the item was wrong"
        requires: []
        critical_omissions:
          - "The escalation ladder: seller → platform → consumer commission"

      - id: consumer.delivery_failure
        title: Non-delivery, wrong item, or delayed delivery
        example: "ordered a laptop 2 months ago, still not delivered and no refund"
        requires: []
        critical_omissions:
          - "That the marketplace may have independent obligations"

      - id: consumer.deficiency_in_service
        title: Deficiency in service
        example: "the repair shop kept my AC for 3 months and returned it broken"
        requires: []
        critical_omissions:
          - "That 'deficiency' is statutorily defined and services are covered, not only goods"

      - id: consumer.unfair_trade_practice
        title: Unfair trade practice or misleading advertisement
        example: "the ad said 90% off but the price was inflated first"
        requires: []
        critical_omissions:
          - "That the regulator route exists in parallel to the commission route"

      - id: consumer.warranty_dispute
        title: Warranty or guarantee not honoured
        example: "phone is under warranty but the service centre wants me to pay"
        requires: []
        critical_omissions:
          - "That warranty terms are contractual and sit alongside statutory rights, not instead of them"

      - id: consumer.platform_liability
        title: Marketplace vs seller responsibility
        example: "amazon says it's the seller's problem, is that true"
        requires: []
        critical_omissions:
          - "The distinction between marketplace and inventory models"

      - id: consumer.where_to_complain
        title: Which forum, and pecuniary jurisdiction
        example: "where do I file a consumer case for a 3 lakh rupee claim"
        requires: [claim_amount]
        escalation_route: true
        critical_omissions:
          - "The pecuniary threshold that determines the forum"
          - "The online filing route"

      - id: consumer.limitation_and_timeline
        title: Time limits to file
        example: "how long do I have to file a consumer complaint"
        requires: [incident_date]
        critical_omissions:
          - "That limitation runs from the date the cause of action arose, not the purchase date"
          - "That condonation of delay may be possible but is discretionary"

      - id: consumer.compensation_and_relief
        title: What can be claimed
        example: "can I claim compensation for the mental harassment also"
        requires: []
        critical_omissions:
          - "That relief is at the commission's discretion, not automatic"

  # =========================================================================
  - id: tenancy
    title: Tenancy
    description: >
      Basic residential landlord and tenant questions. The most state-sensitive
      vertical — nearly every category requires the state before answering.
    primary_acts: [tpa1882, mta2021]
    state_sensitive: true
    categories:

      - id: tenancy.security_deposit
        title: Security deposit not returned
        example: "landlord is not returning my deposit after I moved out"
        requires: [state]
        critical_omissions:
          - "That deposit caps and return timelines are state-specific"

      - id: tenancy.rent_increase
        title: Rent increase
        example: "my landlord increased rent by 30% suddenly, is that allowed"
        requires: [state]
        critical_omissions:
          - "That permissible increases depend on the state regime and the agreement"

      - id: tenancy.eviction
        title: Eviction and notice
        example: "landlord told me to vacate in 5 days"
        requires: [state]
        critical_omissions:
          - "That eviction generally requires due process, not self-help"
          - "That notice periods are state- and contract-specific"

      - id: tenancy.landlord_entry
        title: Landlord entry and privacy
        example: "my landlord enters my flat whenever he wants"
        requires: [state]
        critical_omissions: []

      - id: tenancy.repairs_maintenance
        title: Repairs and maintenance obligations
        example: "who is supposed to fix the leaking bathroom, me or the owner"
        requires: [state]
        critical_omissions:
          - "That the split between structural and minor repairs is usually contractual"

      - id: tenancy.agreement_registration
        title: Rent agreement and registration
        example: "is an 11 month agreement valid without registration"
        requires: [state]
        critical_omissions:
          - "That registration requirements are state-specific"

      - id: tenancy.lock_in_notice
        title: Lock-in period and notice to vacate
        example: "I want to leave before the lock-in ends, will I lose my deposit"
        requires: [state]
        critical_omissions: []

      - id: tenancy.utilities_charges
        title: Utilities and additional charges
        example: "landlord is charging me commercial electricity rates"
        requires: [state]
        critical_omissions: []

      - id: tenancy.where_to_complain
        title: Where to raise a tenancy dispute
        example: "who do I complain to about my landlord"
        requires: [state]
        escalation_route: true
        critical_omissions:
          - "That the forum depends entirely on whether the state has adopted a tenancy authority regime"

  # =========================================================================
  - id: traffic
    title: Traffic
    description: >
      Everyday traffic rules, fines, and documents under the central framework
      and state compounding notifications.
    primary_acts: [mva1988, cmvr1989]
    state_sensitive: true
    categories:

      - id: traffic.challan_amount
        title: Fine amount for an offence
        example: "how much is the fine for jumping a red light"
        requires: [state]
        critical_omissions:
          - "That compounding amounts are set by state notification and vary"

      - id: traffic.document_offences
        title: Driving licence, RC, insurance, PUC
        example: "caught driving without insurance, what happens"
        requires: [state]
        critical_omissions:
          - "That driving without valid third-party insurance is a distinct and serious offence"

      - id: traffic.helmet_seatbelt
        title: Helmet and seatbelt
        example: "fine for riding without helmet"
        requires: [state]
        critical_omissions: []

      - id: traffic.overspeeding
        title: Overspeeding
        example: "got a speeding challan on the highway"
        requires: [state, vehicle_type]
        critical_omissions:
          - "That penalties differ between light and heavy vehicles"

      - id: traffic.vehicle_impound
        title: Vehicle seized or impounded
        example: "police took my bike, how do I get it back"
        requires: [state]
        critical_omissions: []

      - id: traffic.accident_immediate_steps
        title: Immediate steps after a road accident
        example: "had a minor accident, what should I do right now"
        requires: []
        state_exempt: true
        state_exempt_reason: >
          The duty to stop and assist is a central-law obligation under the
          Motor Vehicles Act and does not vary by state. Asking for the state
          before answering would be an unnecessary delay in an urgent situation.
        critical_omissions:
          - "The statutory duty to stop and assist the injured"
          - "That injury or death makes this a police matter beyond this tool's scope"
        boundary_resolved: "2026-08-13"
        boundary_decision: partial_answer_with_redirect
        boundary_note: >
          RESOLVED — same split as traffic.drunk_driving. The statutory duty to
          stop and assist is a fact in our corpus and is exactly what a person
          needs in the first minutes after a crash. Anything touching injury,
          death, liability or prosecution is a refusal.
        answerable:
          - "The statutory duty to stop and render assistance"
          - "The duty to report to police, and the timeframe"
          - "What information to exchange with the other party"
          - "That an insurance claim requires prompt notification to the insurer"
        must_refuse:
          - "Someone was injured, am I in trouble"
          - "Who is at fault"
          - "Will I be arrested / how do I get bail"
          - "How much compensation can I claim from them"
          - "Should I settle privately"
        mandatory_response_rules:
          - "If injury or death is mentioned, refuse and redirect immediately"
          - "Never assess fault or liability"
          - "Never estimate compensation"
          - "State procedural duties only, in the order they must be done"

      - id: traffic.compounding_payment
        title: Paying or contesting a challan
        example: "how do I pay an e-challan, and can I contest it"
        requires: [state]
        critical_omissions:
          - "That contesting means a court appearance"

      - id: traffic.licence_suspension
        title: Licence suspension or disqualification
        example: "can they cancel my licence for repeated challans"
        requires: [state]
        critical_omissions: []

      - id: traffic.where_to_complain
        title: Where to dispute a challan or raise a traffic grievance
        example: "I got a challan for a place I've never driven to, where do I dispute it"
        requires: [state]
        escalation_route: true
        critical_omissions:
          - "That the forum named on the challan itself is the primary route"
          - "That contesting generally means appearing before a court"

      - id: traffic.drunk_driving
        title: Drink-driving
        example: "what is the penalty for drunk driving"
        requires: [state]
        boundary_resolved: "2026-08-13"
        boundary_decision: partial_answer_with_redirect
        boundary_note: >
          RESOLVED — Option A. Drink-driving is an offence under the Motor
          Vehicles Act, an in-scope statute, but it is prosecuted criminally and
          criminal matters are out of scope. The resolution splits the topic by
          what is being asked, not by subject: the statutory penalty is a fact
          in our corpus and may be stated; anything about a live prosecution is
          a refusal.
        answerable:
          - "The penalty prescribed by the Motor Vehicles Act — fine, imprisonment term"
          - "The prescribed blood-alcohol limit"
          - "Licence suspension or disqualification consequences"
          - "That penalties escalate for repeat offences"
        must_refuse:
          - "I was arrested last night, what do I do"
          - "How do I get bail"
          - "How do I fight or defend this case"
          - "Will I go to jail"
          - "Should I plead guilty"
        mandatory_response_rules:
          - "State the statutory penalty only; never assess the person's own case"
          - "Always say this is a criminal offence, not a compoundable traffic fine"
          - "Always advise that a lawyer is needed once proceedings have begun"
          - "Refuse and redirect the moment the question turns to arrest, bail, or defence"
        critical_omissions:
          - "That this is a criminal offence and legal representation is advisable"
          - "That the tool cannot advise on arrest, bail, or defence"

  # =========================================================================
  - id: employment
    title: Employment and workplace rights
    description: >
      Everyday employment questions across two groups. GROUP A — payments and
      benefits: salary, PF, gratuity, bonus, minimum wages, deductions.
      GROUP B — workplace rights: termination and notice, retrenchment,
      working hours, leave, maternity, workplace sexual harassment, and
      appointment terms.

      Still excluded: individual litigation strategy, and anything requiring a
      lawyer to read your specific contract.
    primary_acts: [gratuity1972, epf1952, posh2013]
    regime_sensitive: true
    state_sensitive: true
    blocked_on: >
      Task 7 must establish from the Gazette which regime is in force at the
      corpus snapshot date — the older Acts or the four labour codes. No
      employment training data may be written before that is recorded.
    categories:

      - id: employment.unpaid_salary
        title: Salary unpaid or delayed
        example: "company hasn't paid salary for 2 months"
        requires: [state, employment_type]
        critical_omissions:
          - "The applicable regime and its date, given the labour-code transition"
          - "The labour authority escalation route"

      - id: employment.gratuity_eligibility
        title: Am I eligible for gratuity
        example: "worked 4 years 8 months, do I get gratuity"
        requires: [employment_type]
        state_exempt: true
        state_exempt_reason: >-
          Gratuity entitlement is central law and does not vary by state.
        critical_omissions:
          - "The continuous-service condition"
          - "The establishment-size applicability threshold"

      - id: employment.gratuity_calculation
        title: How much gratuity am I owed
        example: "how is gratuity calculated on 50000 salary"
        requires: [employment_type]
        state_exempt: true
        state_exempt_reason: >-
          The gratuity formula and ceiling are central law.
        critical_omissions:
          - "Which components of salary count"
          - "That a statutory ceiling applies"

      - id: employment.pf_contribution
        title: PF contribution and rates
        example: "employer is not depositing my PF"
        requires: [employment_type]
        state_exempt: true
        state_exempt_reason: >-
          PF contribution rates are central law, administered by EPFO nationally.
        critical_omissions:
          - "The EPFO grievance route"

      - id: employment.pf_withdrawal
        title: PF withdrawal and transfer
        example: "how do I withdraw PF after leaving a job"
        requires: []
        state_exempt: true
        state_exempt_reason: >-
          PF withdrawal procedure is central and administered by EPFO nationally.
        critical_omissions: []

      - id: employment.final_settlement
        title: Full and final settlement on exit
        example: "company is holding my F&F for 3 months"
        requires: [state, employment_type]
        critical_omissions: []

      - id: employment.bonus
        title: Statutory bonus
        example: "am I entitled to a bonus"
        requires: [employment_type]
        state_exempt: true
        state_exempt_reason: >-
          Statutory bonus eligibility and rates are central law.
        critical_omissions:
          - "The eligibility wage ceiling"

      - id: employment.minimum_wages
        title: Minimum wages
        example: "is 9000 per month legal for a full time job"
        requires: [state, employment_type]
        critical_omissions:
          - "That minimum wages are notified per state, per skill category, and revised periodically"

      - id: employment.payslip_deductions
        title: Payslip and deductions
        example: "employer deducted 15000 saying it's a penalty"
        requires: [state]
        critical_omissions:
          - "That only statutorily permitted deductions are lawful"

      # --- Group B: workplace rights ------------------------------------

      - id: employment.termination_notice
        title: Termination and notice period
        example: "company fired me without any notice, is that legal"
        requires: [state, employment_type]
        critical_omissions:
          - "The applicable regime and its date, given the labour-code transition"
          - "That notice entitlement depends on the contract as well as statute"
          - "That challenging a dismissal is a dispute needing a lawyer, not a query"

      - id: employment.retrenchment
        title: Retrenchment and layoffs
        example: "company is laying off 40 people, what are we entitled to"
        requires: [state, employment_type]
        critical_omissions:
          - "That retrenchment compensation and notice depend on length of service"
          - "That establishment size determines which provisions apply"

      - id: employment.working_hours
        title: Working hours and overtime
        example: "my office makes me work 12 hours a day with no overtime pay"
        requires: [state, establishment_category]
        critical_omissions:
          - "That hours and overtime come from state Shops and Establishments law for offices"

      - id: employment.leave_entitlement
        title: Leave entitlement
        example: "how many casual leaves am I entitled to in a year"
        requires: [state, establishment_category]
        critical_omissions:
          - "That leave entitlement is state law and differs substantially between states"
          - "That the employment contract may grant more, never less"

      - id: employment.maternity_benefits
        title: Maternity leave and benefits
        example: "am I entitled to paid maternity leave in a startup with 8 people"
        requires: [employment_type]
        state_exempt: true
        state_exempt_reason: >-
          Maternity benefit entitlement is central law and uniform across states.
        critical_omissions:
          - "The establishment-size applicability threshold"
          - "That the entitlement covers both leave and job protection"

      - id: employment.workplace_harassment
        title: Workplace sexual harassment
        example: "my manager keeps making inappropriate comments, what can I do"
        requires: []
        sensitive: true
        state_exempt: true
        state_exempt_reason: >-
          The POSH framework is central law and applies uniformly. Asking for the state would also delay a distress query for no benefit.
        critical_omissions:
          - "That every qualifying workplace must have an Internal Committee"
          - "That a Local Committee route exists where there is no Internal Committee"
          - "The time limit for filing a complaint"
          - "That support services exist and the person is not required to act alone"
        mandatory_response_rules:
          - "Lead with support, not procedure"
          - "Never ask the person to describe what happened"
          - "Never assess whether the conduct 'counts' as harassment"
          - "Always give the Internal Committee and Local Committee routes"
          - "Always point to a helpline or support service"
          - "Never suggest raising it informally with the person complained against"
        note: >
          Sensitive category. Answer the procedural facts and the routes, always
          with a support redirect. This is not a routine information query and
          must not be trained or evaluated as one.

      - id: employment.appointment_terms
        title: Appointment letter, probation, and bonds
        example: "company is asking me to sign a 3 year bond, is that enforceable"
        requires: [state, employment_type]
        critical_omissions:
          - "That enforceability of a bond is fact-specific and needs a lawyer"
          - "That the tool cannot review the specific contract"

      - id: employment.resignation_notice
        title: Resignation and notice period
        example: "I resigned but they are not relieving me for 3 months"
        requires: [state, employment_type]
        critical_omissions:
          - "That notice terms are primarily contractual"

      - id: employment.where_to_complain
        title: Where to complain about an employer
        example: "who do I report my company to for not paying"
        requires: [state]
        escalation_route: true
        critical_omissions:
          - "That the forum depends on the applicable statute and the establishment type"

