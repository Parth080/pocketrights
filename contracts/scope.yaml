        critical_omissions:
          - "That waiting periods and moratorium provisions are regulated"

      - id: insurance.motor_claim
        title: Motor insurance claim
        example: "own damage claim rejected after an accident"
        requires: []
        critical_omissions: []

      - id: insurance.mis_selling
        title: Mis-selling
        example: "agent told me it was a fixed deposit, turned out to be a ULIP"
