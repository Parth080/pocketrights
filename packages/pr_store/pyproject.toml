[project]
name = "pr-store"
version = "0.1.0"
description = "Statute store, facts table, authorities table (SQLite)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.9",
    "pr-corpus",
]

[tool.uv.sources]
pr-corpus = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_store"]
