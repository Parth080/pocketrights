[project]
name = "pr-corpus"
version = "0.1.0"
description = "Source acquisition, provenance, hashing, dated snapshots"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.9",
    "selectolax>=0.3",
    "pymupdf>=1.24",
    "trafilatura>=1.12",
]

[project.scripts]
pr-corpus = "pr_corpus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_corpus"]
