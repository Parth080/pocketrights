[project]
name = "pr-train"
version = "0.1.0"
description = "CPT and SFT; QLoRA / LoRA / full fine-tune"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.9",
    "modal>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_train"]
