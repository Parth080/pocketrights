[project]
name = "pr-verify"
version = "0.1.0"
description = "Verification engine — citation, numeric, authority, scope"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.9",
    "pr-store",
]

[tool.uv.sources]
pr-store = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_verify"]
