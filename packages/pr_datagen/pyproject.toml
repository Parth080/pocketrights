[project]
name = "pr-datagen"
version = "0.1.0"
description = "Scenarios, teacher pipeline, repair loop, CPT corpus"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pr-store",
    "pr-verify",
]

[tool.uv.sources]
pr-store = { workspace = true }
pr-verify = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_datagen"]
